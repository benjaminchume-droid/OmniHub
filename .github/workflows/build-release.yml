name: Build & Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.4)'
        required: false
        default: '1.0.4'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Gradle Wrapper
        run: |
          set -e
          mkdir -p gradle/wrapper
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar"
          curl -fsSL -o gradlew \
            "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew"
          chmod +x gradlew
          printf '%s\n' \
            'distributionBase=GRADLE_USER_HOME' \
            'distributionPath=wrapper/dists' \
            'distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip' \
            'networkTimeout=10000' \
            'validateDistributionUrl=true' \
            'zipStoreBase=GRADLE_USER_HOME' \
            'zipStorePath=wrapper/dists' \
            > gradle/wrapper/gradle-wrapper.properties
          test $(wc -c < gradlew) -gt 5000
          test $(wc -c < gradle/wrapper/gradle-wrapper.jar) -gt 20000

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
          elif [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > keystore.jks
          else
            echo "WARNING: No keystore — unsigned release APK"
            exit 0
          fi
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties
          ls -la keystore.jks

      - name: Build Release APK
        id: build
        run: |
          set -o pipefail
          set +e
          ./gradlew clean assembleRelease --stacktrace 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          set -e
          tail -60 build.log || true
          grep -E "^e: |FAILURE:" build.log | tail -80 || true
          APK=$(find app/build/outputs/apk -type f -name "*.apk" 2>/dev/null | head -n 1 || true)
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "FATAL: No APK produced (gradle status=$STATUS)"
            exit 1
          fi
          SIZE=$(wc -c < "$APK")
          if [ "$SIZE" -lt 500000 ]; then
            echo "FATAL: APK too small ($SIZE bytes)"
            exit 1
          fi
          cp "$APK" "./OmniHub-v1.0.4.apk"
          echo "apk_path=OmniHub-v1.0.4.apk" >> "$GITHUB_OUTPUT"
          ls -lah ./OmniHub-v1.0.4.apk
          exit $STATUS

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OmniHub-1.0.4-apk
          path: OmniHub-v1.0.4.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4-${{ github.run_number }}
          name: OmniHub v1.0.4 (build ${{ github.run_number }})
          body: |
            ## OmniHub v1.0.4
            - **Real chat path** — no fake "Relayed / streaming" demo text
            - Clean greeting only (Good morning, Name)
            - Sign-in marks ready only with a live session
            - Soul ignores system/error junk
            - ChatGPT: send message → provider → show reply

            **Install this APK over the old one.** Settings should show 1.0.4.
          files: OmniHub-v1.0.4.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
