name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > omnihub-release.jks
          echo "storeFile=omnihub-release.jks" >> keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

      - name: Build Release APK
        run: |
          if [ -f keystore.properties ]; then
            ./gradlew assembleRelease
          else
            echo "No signing secrets found — building debug APK instead"
            ./gradlew assembleDebug
          fi

      - name: Find APK
        id: apk
        run: |
          APK=$(find app/build/outputs -name "*.apk" | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found: $APK"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version || '1.0.0' }}
          name: OmniHub v${{ github.event.inputs.version || '1.0.0' }}
          body: |
            ## OmniHub v${{ github.event.inputs.version || '1.0.0' }}
            
            Universal AI aggregator + Android digital assistant.
            
            ### Features
            - Multi-provider routing (API keys + Web Sessions)
            - soul.md persistent memory
            - MCP server connection (paste URL → login → done)
            - Swipe-left history drawer
            - Customize: Skills / Behavior / Tone / MCP
            - System digital assistant support
            
            Install the APK below. Enable "Install unknown apps" if needed.
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
