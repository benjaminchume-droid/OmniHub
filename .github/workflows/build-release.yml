name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Gradle Wrapper
        run: |
          set -e
          mkdir -p gradle/wrapper
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar"
          curl -fsSL -o gradlew \
            "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew"
          chmod +x gradlew
          printf '%s\n' \
            'distributionBase=GRADLE_USER_HOME' \
            'distributionPath=wrapper/dists' \
            'distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip' \
            'networkTimeout=10000' \
            'validateDistributionUrl=true' \
            'zipStoreBase=GRADLE_USER_HOME' \
            'zipStorePath=wrapper/dists' \
            > gradle/wrapper/gradle-wrapper.properties

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "FATAL: KEYSTORE_BASE64 missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties

      - name: Build Release APK
        run: |
          set -o pipefail
          ./gradlew clean assembleRelease --stacktrace 2>&1 | tee build.log
          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          SIZE=$(wc -c < "$APK")
          test "$SIZE" -gt 500000
          cp "$APK" "./OmniHub-v1.0.6.apk"
          ls -lah ./OmniHub-v1.0.6.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OmniHub-1.0.6-apk
          path: OmniHub-v1.0.6.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6-${{ github.run_number }}
          name: OmniHub v1.0.6 (build ${{ github.run_number }})
          body: |
            ## OmniHub v1.0.6

            ### Critical fix
            - **NetworkOnMainThreadException fixed** — chat network runs on IO thread

            ### Chat
            - Messages saved to Room **before** the reply (history no longer vanishes)
            - Long-press a chat: **Rename / Pin / Add to project / Delete**

            ### Updates
            - In-app banner when a newer GitHub Release exists (opens changelog)

            ### Sources
            - Installed-only providers
            - Store shows Installed

            Install this APK. Settings must show **1.0.6**.
          files: OmniHub-v1.0.6.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
