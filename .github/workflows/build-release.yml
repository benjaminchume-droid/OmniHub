name: Build & Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.2)'
        required: false
        default: '1.0.2'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Gradle Wrapper
        run: |
          set -e
          chmod +x gradlew || true
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ $(wc -c < gradle/wrapper/gradle-wrapper.jar) -lt 20000 ]; then
            echo "Downloading official gradle-wrapper.jar"
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar"
          fi
          if [ ! -f gradlew ] || [ $(wc -c < gradlew) -lt 5000 ]; then
            echo "Downloading official gradlew"
            curl -fsSL -o gradlew "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew"
            chmod +x gradlew
          fi
          ls -la gradlew gradle/wrapper/
          wc -c gradlew gradle/wrapper/gradle-wrapper.jar

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
            {
              echo "storeFile=keystore.jks"
              echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
              echo "keyAlias=${{ secrets.KEY_ALIAS }}"
              echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            } > keystore.properties
            ls -la keystore.jks
          elif [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > keystore.jks
            {
              echo "storeFile=keystore.jks"
              echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
              echo "keyAlias=${{ secrets.KEY_ALIAS }}"
              echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            } > keystore.properties
          else
            echo "WARNING: No keystore — unsigned release APK"
          fi

      - name: Build Release APK
        id: build
        run: |
          set -euo pipefail
          ./gradlew --version
          ./gradlew clean assembleRelease --stacktrace 2>&1 | tee build.log
          echo "---- APK search ----"
          find app/build/outputs -type f -name "*.apk" -exec ls -lah {} \; || true
          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1 || true)
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "FATAL: No APK produced"
            grep -E "^e: |error:|FAILED|Unresolved reference" build.log | tail -100 || true
            exit 1
          fi
          SIZE=$(wc -c < "$APK")
          echo "APK=$APK size=$SIZE"
          if [ "$SIZE" -lt 500000 ]; then
            echo "FATAL: APK too small ($SIZE bytes) — not a real package"
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "apk_size=$SIZE" >> "$GITHUB_OUTPUT"
          cp "$APK" "./OmniHub-v1.0.2.apk"
          ls -lah ./OmniHub-v1.0.2.apk
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniHub-1.0.2-apk
          path: |
            OmniHub-v1.0.2.apk
            app/build/outputs/apk/**/*.apk
            build.log
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: OmniHub v1.0.2
          body_path: CHANGELOG.md
          files: OmniHub-v1.0.2.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
