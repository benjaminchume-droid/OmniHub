name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > omnihub-release.jks
            echo "storeFile=omnihub-release.jks" > keystore.properties
            echo "storePassword=$KEYSTORE_PASSWORD" >> keystore.properties
            echo "keyAlias=$KEY_ALIAS" >> keystore.properties
            echo "keyPassword=$KEY_PASSWORD" >> keystore.properties
            echo "Keystore decoded successfully"
          else
            echo "No KEYSTORE_BASE64 secret — will build debug APK"
          fi

      - name: Build APK
        run: |
          if [ -f keystore.properties ]; then
            echo "Building signed release APK..."
            gradle assembleRelease --stacktrace || ./gradlew assembleRelease --stacktrace
          else
            echo "Building debug APK..."
            gradle assembleDebug --stacktrace || ./gradlew assembleDebug --stacktrace
          fi

      - name: Find APK
        id: apk
        run: |
          APK=$(find app/build/outputs -name "*.apk" 2>/dev/null | head -1 || true)
          if [ -z "$APK" ]; then
            echo "No APK produced — project still incomplete"
            exit 1
          fi
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"
          ls -lh "$APK"

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version || github.ref_name || '1.0.0' }}
          name: OmniHub v${{ github.event.inputs.version || '1.0.0' }}
          body: |
            ## OmniHub v${{ github.event.inputs.version || '1.0.0' }}
            Universal AI aggregator + Android digital assistant.
            Multi-provider routing with fallback, Web Sessions, MCP, Dark/Light/System theme.
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
