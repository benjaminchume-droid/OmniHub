name: Build & Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.2)'
        required: false
        default: '1.0.2'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Gradle Wrapper
        run: |
          set -e
          mkdir -p gradle/wrapper
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar"
          curl -fsSL -o gradlew "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew"
          chmod +x gradlew
          printf '%s\n' \
            'distributionBase=GRADLE_USER_HOME' \
            'distributionPath=wrapper/dists' \
            'distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip' \
            'networkTimeout=10000' \
            'validateDistributionUrl=true' \
            'zipStoreBase=GRADLE_USER_HOME' \
            'zipStorePath=wrapper/dists' \
            > gradle/wrapper/gradle-wrapper.properties
          ls -la gradlew gradle/wrapper/
          wc -c gradlew gradle/wrapper/gradle-wrapper.jar

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
            echo "storeFile=keystore.jks" > keystore.properties
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
          elif [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > keystore.jks
            echo "storeFile=keystore.jks" > keystore.properties
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
          else
            echo "WARNING: No keystore — unsigned release APK"
          fi

      - name: Build Release APK
        id: build
        run: |
          set -o pipefail
          ./gradlew --version
          set +e
          ./gradlew clean assembleRelease --stacktrace 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          set -e
          echo "---- Gradle exit: $STATUS ----"
          echo "---- Errors ----"
          grep -E "^e: |Unresolved reference|is not abstract|Conflicting overloads|error:" build.log | tail -120 || true
          echo "---- APK search ----"
          find app/build/outputs -type f -name "*.apk" -exec ls -lah {} \; || true
          APK=$(find app/build/outputs/apk -type f -name "*.apk" 2>/dev/null | head -n 1 || true)
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "FATAL: No APK produced (gradle status=$STATUS)"
            exit 1
          fi
          SIZE=$(wc -c < "$APK")
          echo "APK=$APK size=$SIZE"
          if [ "$SIZE" -lt 500000 ]; then
            echo "FATAL: APK too small ($SIZE bytes)"
            exit 1
          fi
          cp "$APK" "./OmniHub-v1.0.2.apk"
          ls -lah ./OmniHub-v1.0.2.apk
          exit $STATUS
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OmniHub-1.0.2-apk
          path: OmniHub-v1.0.2.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: OmniHub v1.0.2
          body_path: CHANGELOG.md
          files: OmniHub-v1.0.2.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
