name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: 'nightly (default) or stable'
        required: false
        default: 'nightly'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Gradle Wrapper
        run: |
          set -e
          mkdir -p gradle/wrapper
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar"
          curl -fsSL -o gradlew \
            "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew"
          chmod +x gradlew
          printf '%s\n' \
            'distributionBase=GRADLE_USER_HOME' \
            'distributionPath=wrapper/dists' \
            'distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip' \
            'networkTimeout=10000' \
            'validateDistributionUrl=true' \
            'zipStoreBase=GRADLE_USER_HOME' \
            'zipStorePath=wrapper/dists' \
            > gradle/wrapper/gradle-wrapper.properties

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "FATAL: KEYSTORE_BASE64 missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties

      - name: Read versionName
        id: ver
        run: |
          VN=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*versionName\s*=\s*"([^"]+)".*/\1/')
          if [ -z "$VN" ]; then VN="1.0.9.7"; fi
          echo "version=$VN" >> $GITHUB_OUTPUT
          echo "Resolved versionName=$VN"

      - name: Decide channel
        id: meta
        run: |
          CHANNEL="${{ github.event.inputs.channel }}"
          if [ -z "$CHANNEL" ]; then CHANNEL=nightly; fi
          if [ "${{ github.event_name }}" = "push" ]; then CHANNEL=nightly; fi
          VN="${{ steps.ver.outputs.version }}"
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
          if [ "$CHANNEL" = "stable" ]; then
            echo "tag=v${VN}" >> $GITHUB_OUTPUT
            echo "name=OmniHub v${VN}" >> $GITHUB_OUTPUT
            echo "apk=OmniHub-v${VN}.apk" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "make_latest=true" >> $GITHUB_OUTPUT
          else
            echo "tag=v${VN}-nightly.${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "name=OmniHub ${VN} Nightly #${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "apk=OmniHub-${VN}-nightly.apk" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "make_latest=true" >> $GITHUB_OUTPUT
          fi

      - name: Build Release APK
        run: |
          set -o pipefail
          ./gradlew clean assembleRelease --stacktrace 2>&1 | tee build.log
          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          SIZE=$(wc -c < "$APK")
          test "$SIZE" -gt 500000
          cp "$APK" "./${{ steps.meta.outputs.apk }}"
          ls -lah "./${{ steps.meta.outputs.apk }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk }}
          path: ${{ steps.meta.outputs.apk }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: true
          body: |
            ## ${{ steps.meta.outputs.name }}

            App versionName: **${{ steps.ver.outputs.version }}**
            Channel: **${{ steps.meta.outputs.channel }}**

            ### 1.0.9.7 WebRelay (universal)
            - Conversation **fingerprint baseline** (structure-agnostic)
            - SEND confirmed only on **user-turn evidence** or generating UI
            - REPLY primary = **delta after baseline**; role/class selectors are boosts only
            - Timeout salvage uses main/body tail + user-message split
            - Same path for ChatGPT / Perplexity / S.ai / all providers
            - No per-provider product fork; queue + fail-fast INPUT kept

            Install the APK attached to this release.
          files: ${{ steps.meta.outputs.apk }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
