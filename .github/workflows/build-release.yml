name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Downloading gradle-wrapper.jar..."
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              "https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar"
          fi
          if [ ! -f gradlew ]; then
            echo "gradlew missing — creating minimal launcher"
            cat > gradlew << 'SCRIPT'
          #!/bin/sh
          exec java -classpath "$(dirname "$0")/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"
          SCRIPT
          fi
          chmod +x gradlew
          # normalize line endings in case of CRLF
          sed -i 's/\r$//' gradlew || true
          ls -la
          ls -la gradle/wrapper/
          head -3 gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > omnihub-release.jks
            echo "storeFile=omnihub-release.jks" > keystore.properties
            echo "storePassword=$KEYSTORE_PASSWORD" >> keystore.properties
            echo "keyAlias=$KEY_ALIAS" >> keystore.properties
            echo "keyPassword=$KEY_PASSWORD" >> keystore.properties
            echo "Keystore decoded successfully"
          else
            echo "No KEYSTORE_BASE64 secret — will build debug APK"
          fi

      - name: Build APK
        run: |
          run_gradle() {
            if [ -x ./gradlew ] || [ -f ./gradlew ]; then
              echo "Using bash ./gradlew $*"
              bash ./gradlew "$@"
            elif command -v gradle >/dev/null 2>&1; then
              echo "Using system gradle $*"
              gradle "$@"
            else
              echo "Neither gradlew nor gradle available"
              exit 127
            fi
          }

          if [ -f keystore.properties ]; then
            echo "Building signed release APK..."
            run_gradle assembleRelease --stacktrace
          else
            echo "Building debug APK..."
            run_gradle assembleDebug --stacktrace
          fi

      - name: Find APK
        id: apk
        run: |
          APK=$(find app/build/outputs -name "*.apk" 2>/dev/null | head -1 || true)
          if [ -z "$APK" ]; then
            echo "No APK produced"
            find app/build -type f 2>/dev/null | head -50 || true
            exit 1
          fi
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"
          ls -lh "$APK"

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version || github.ref_name || '1.0.0' }}
          name: OmniHub v${{ github.event.inputs.version || '1.0.0' }}
          body: |
            ## OmniHub v${{ github.event.inputs.version || '1.0.0' }}
            Universal AI aggregator + Android digital assistant.
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
